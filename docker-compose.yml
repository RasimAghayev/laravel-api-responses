name: laravel-api-responses-p5

services:
  app:
    build:
      context: .
      target: runtime
    image: laravel-api-responses-p5:local
    container_name: laravel-api-responses-p5-app
    ports:
      - "${APP_HTTP_PORT:-20100}:8080"
    environment:
      - APP_ENV=local
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/healthcheck.sh"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3

  test:
    build:
      context: .
      target: test
    image: laravel-api-responses-p5-test:local
    container_name: laravel-api-responses-p5-test
    # No port mapping — this stage is build-only, never exposed.
    # No depends_on: this repo is a standalone library with no DB/cache/queue.